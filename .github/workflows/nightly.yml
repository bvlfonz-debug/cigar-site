name: Nightly cigar database update

on:
  schedule:
    # Hourly, not just once at 09:00 UTC — the owner's Claude Pro quota is
    # shared with their own daytime usage, so a run can fail purely because
    # the quota is temporarily exhausted. Checking hourly means it picks back
    # up automatically once quota frees up, instead of waiting a full day.
    # The guard step below makes every hour where today's real work is
    # already done cost almost nothing (a git log check, no Node/Claude
    # install), so this stays cheap on GitHub Actions' free minutes.
    #
    # Minute is :17, not :00 — GitHub's own docs warn that schedules firing
    # exactly on the hour hit the worst congestion and are the most likely
    # to be delayed or silently dropped. (0 * * * * ran zero times in the
    # ~6 hours after it was first set, across 6 expected ticks — moved off
    # the hour after seeing that.)
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-automation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not fetch-depth: 1 — the guard step below needs to
          # look back through however many hourly attempts happened today.
          fetch-depth: 0

      - name: Check whether real work already landed today
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # A "real" commit is any nightly commit that isn't just the
          # fallback safety net logging a failure — if one already exists
          # for today, skip the rest of this hour's job entirely rather than
          # retrying (quota frugality: don't hammer for marginal gains once
          # today's work is actually done).
          if git log --oneline --grep="^nightly: $TODAY" -E | grep -v "did not finish cleanly" | grep -q .; then
            echo "Real work already committed for $TODAY — skipping this hourly check-in."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No real work committed for $TODAY yet — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: npm ci

      - name: Install Claude Code
        if: steps.guard.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "StickScore Nightly Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Determine turn budget
        if: steps.guard.outputs.should_run == 'true'
        id: budget
        run: |
          DOW=$(date -u +%w)
          if [ "$DOW" = "0" ]; then
            echo "max_turns=90" >> "$GITHUB_OUTPUT"
            echo "day_type=Sunday — a heavier catalog pass is allowed today" >> "$GITHUB_OUTPUT"
            echo "cigar_growth_batch=6" >> "$GITHUB_OUTPUT"
          else
            echo "max_turns=40" >> "$GITHUB_OUTPUT"
            echo "day_type=a weekday — keep this run lean" >> "$GITHUB_OUTPUT"
            echo "cigar_growth_batch=3" >> "$GITHUB_OUTPUT"
          fi
          # Every-other-day cadence for autonomous cigar growth (see CLAUDE.md
          # "Autonomous cigar catalog growth") — even day-of-month runs it,
          # odd skips it, so this turn-hungry extra task doesn't compete with
          # the existing rotation/triage/price work every single night.
          DOM=$(date -u +%-d)
          if [ $((DOM % 2)) -eq 0 ]; then
            echo "cigar_growth_today=true" >> "$GITHUB_OUTPUT"
          else
            echo "cigar_growth_today=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run nightly update
        if: steps.guard.outputs.should_run == 'true'
        id: nightly
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          # Defensive: strip any stray whitespace/newlines a copy-paste into
          # the GitHub secret might have introduced — a raw newline in an
          # HTTP header value makes every API call fail instantly.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          claude -p "Follow the 'Nightly automation' section of CLAUDE.md in this repository exactly, from top to bottom (Ingest, Price refresh, Score recompute, Generate, Publish gate, commit+push, run-log entry). Also follow the 'Accessories Expansion' and 'Lounge Directory Expansion' sections, in particular their 'Nightly automation folding' subsections: accessories and lounges work shares this SAME run and SAME turn budget, not a separate one each. Rotate focus night-to-night across all three verticals (cigars, accessories, lounges) rather than trying to cover all of them every night — compute today's day-of-month modulo 3 (0 = cigars, 1 = accessories, 2 = lounges) and focus tonight's run on whichever that picks, checking today's date yourself.

          Today is $(date -u +%Y-%m-%d). Today is ${{ steps.budget.outputs.day_type }}. Your turn budget for this run is ${{ steps.budget.outputs.max_turns }}, and --max-turns is a HARD cutoff — if you hit it mid-step, you will be killed instantly with no chance to save anything. So: commit and push after EACH major step completes (e.g. right after price checks, right after news ingestion, right after score recomputes), not once at the very end. Append to data/run-log.md at the same time as each of those commits, a little at a time, rather than saving all the writing for a final summary you might not reach. If you're more than half your turn budget in and still have major steps left, wrap up what you're on, commit and push it, log what's left as 'NEEDS-ATTENTION: ran out of turns before finishing X', and stop there rather than starting something new.

          Tooling: use \`node scripts/db-tools.mjs <command> '<json>'\` for every database change. Cigar-side: add-critic-review, add-price-point, add-news-item, add-brand, add-line, add-vitola, recompute-stick-score, find-vitola. Accessory-side: add-accessory-review, add-accessory-price-point, add-accessory-category, add-accessory, recompute-acc-score, find-accessory. Lounge-side: add-lounge, find-lounge, add-lounge-external-rating, recompute-lounge-score. Release-calendar-side: add-release, update-release, find-release — whenever you add-vitola for a brand/line that has an unlinked cigar_release entry (related_vitola_id still null, matching brand/line name case-insensitively), call update-release with related_vitola_path to link it; whenever a news brief you write is itself reporting a release, call add-release (or update-release on an existing one) with related_news_item_id set to that news item's id, in the same pass. Brand/factory-side: add-factory, update-factory, find-factory, update-brand, add-brand-source, add-factory-source — when researching a brand and you find a real citable source for its founding info or factory, record it with add-brand-source/add-factory-source and link with update-brand/update-factory rather than leaving brand.factory as an unsourced plain-text guess; NEVER fabricate founded_year or history_text — leave them unset if no real source is found (add-factory/add-brand already auto-queue that gap for the owner). Pairing-side: add-pairing-citation, find-pairing-citations — if genuine research turns up a real critic/publication pairing recommendation (e.g. \"pairs well with a bourbon\") for a cigar already in the catalog, record it via add-pairing-citation. NEVER call add-community-pairing unsupervised — that command is only for the owner to run after personally reading a real submission, and NEVER edit src/lib/pairingRules.ts or src/lib/pairingTopics.ts (owner-maintained editorial content). Shared: queue-add, queue-list. NEVER run \`npm run seed\` — that script wipes and rebuilds the entire database from scratch and would destroy all price history and every cigar, accessory, lounge, release, brand, and factory added since the initial commit.

          New brands, lines, accessory categories, lounges/cities, or factories you haven't seen before must go through queue-add, not add-brand/add-line/add-accessory-category/add-lounge/add-factory directly — only create them directly if data/review-queue.json already has a matching entry with \"decision\": \"approve\" from the owner, OR if you are performing the Sunday weekly queue triage described below, OR if you are adding a genuinely new CIGAR (brand/line/vitola only, not accessories/lounges/factories) as part of today's cigar-growth batch described below — that one's a standing owner-approved exception, not something to re-confirm each time. Lounge ratings must ONLY come from cited external platforms (Google/Yelp/TripAdvisor-style aggregates) or genuine dated editorial rankings — never a first-hand rating you generate yourself.

          New cigar growth (today's cigar_growth_today flag is ${{ steps.budget.outputs.cigar_growth_today }} — only do this section if that says true; skip it entirely otherwise, including on the weekly-rotation's own cigars night if the flag says false): the owner wants the cigar catalog to keep growing on its own, with no per-item approval needed, so this runs independently of the cigars/accessories/lounges rotation above — even on an accessories or lounges night, still do this if the flag is true. Target ${{ steps.budget.outputs.cigar_growth_batch }} genuinely new cigars this run (a real brand/line/vitola combination not already in the catalog), stopping early rather than rushing if you're running low on turns. Prefer extending a brand ALREADY in the catalog with a real line/vitola it actually offers that isn't catalogued yet — cheaper to verify and lower duplicate risk than a brand-new brand, though brand-new brands are fine too with the same sourcing rigor as 'Brand & Factory Profiles' below. Before adding anything, check the database directly for exact slug collisions AND near-duplicates (same brand+line with dimensions within about a quarter-inch of length or a few ring-gauge points of something already on file) — that specific near-duplicate pattern, not exact matches, is the real recurring failure mode here, so when in doubt, skip the candidate rather than risk it. Verify every candidate is real via at least one live search before adding it — never invent a brand, blend, wrapper, or tasting note; tasting_notes/summary_review must come from something you actually found (a retailer page, a review), and if nothing describes flavor, write a plainer summary from the confirmed blend composition alone instead of inventing descriptors. A critic citation is best-effort only (a search or two per cigar, not exhaustive) — a cigar added without one just shows 'insufficient data,' same as anywhere else on the site. Log exactly what you added, and what you skipped as a likely duplicate or unverifiable, in tonight's run-log.md entry.

          Weekly queue triage (Sundays only — skip this entirely on weekdays): after your regular rotation work above, spend some of today's larger turn budget triaging data/review-queue.json yourself instead of leaving every item for the owner to review by hand. Skip informational/tracking entries (reasons like insufficient_sources, conflicting_facts, vitola_dimension_conflict, unconfirmed_citation_details, and similar gap-notes) — those don't need a decision, they're just visibility into what's still thin on sources. Focus only on entries proposing a genuinely new entity (reasons like new_lounge_city, new_lounges, new_factory_candidate, new_factory_and_brand_candidate, new_line_candidate, new_accessory_category, or similar). For each one: re-verify its sources_found yourself (don't trust a queued proposal blindly just because it's already there — re-check the URLs are live and still say what the entry claims); reject anything you can't independently confirm with a still-working source, anything that conflicts with something the owner has said directly in a prior commit message or run-log entry (search git log and data/run-log.md for the item's name first), and anything only a legal/scope judgment call could settle (e.g. whether a third-party pop-up event counts as a standing lounge) — leave those explicitly for the owner instead of guessing. Approve and add (with the correct add-* command) anything that clears the same evidence bar as every other non-negotiable rule in this file: multiple independent, currently-live, genuinely on-topic sources. Either way — approved, rejected, or explicitly left for the owner — call queue-resolve on every new-entity item you touch so the queue doesn't just keep growing; if you leave one for the owner, say so plainly in the run-log entry rather than silently leaving it queued. Write a clear, dated, plain-English summary of every decision (what got added, what got rejected and why, what got left for the owner and why) to data/run-log.md, same tone as every other entry in that file — this is the owner's only visibility into decisions you made without asking first, so be thorough and honest about it, including your own uncertainty where it exists.

          Guardrails, non-negotiable: never delete existing records; never modify config/affiliates.json values, the age gate component, the FTC disclosure component, CLAUDE.md, or this workflow file itself; if a source site is unreachable, skip it and note that in the log rather than guessing at its data.

          Before committing, run \`npm run build\` to confirm the site still builds cleanly. If it fails, fix the issue or revert the specific change that broke it rather than pushing a broken build.

          When you are done (or stopping early), make sure your work is committed with a message in the form 'nightly: <date> — <one-line summary>' and pushed to main. Append a dated, plain-English entry to data/run-log.md summarizing what was done, what was skipped, what was queued, and any errors — this file is the owner's only window into what happened tonight and they are not a programmer." \
            --max-turns "${{ steps.budget.outputs.max_turns }}" \
            --dangerously-skip-permissions 2>&1 | tee /tmp/claude-output.log
          echo "claude_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Fallback logging and commit if Claude didn't finish cleanly
        if: steps.guard.outputs.should_run == 'true'
        run: |
          EXIT_CODE="${{ steps.nightly.outputs.claude_exit_code }}"
          HAS_CHANGES=""
          [ -n "$(git status --porcelain)" ] && HAS_CHANGES="1"

          if [ "$EXIT_CODE" = "0" ] && [ -z "$HAS_CHANGES" ]; then
            echo "Nothing left uncommitted — Claude's own commit already covered it."
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)
          if [ -z "$HAS_CHANGES" ] && git log --oneline --grep="^nightly: $TODAY — run did not finish cleanly" -E | grep -q .; then
            # Pure failure, nothing new to preserve, and today already has a
            # failure logged — skip logging a near-identical duplicate every
            # hour while quota stays exhausted. It'll keep retrying silently.
            echo "Already logged today's failure with no new changes since — skipping duplicate entry."
            exit 0
          fi

          REASON="The run exited with code $EXIT_CODE. Check this run's logs in the Actions tab for details."
          if grep -qi "session limit\|usage limit\|rate limit" /tmp/claude-output.log 2>/dev/null; then
            REASON="This is a quota issue, not a bug: the nightly automation shares your Claude Pro usage limit with your own daytime use, and tonight's budget was already used up. Nothing to fix — it'll work again once your quota resets."
          fi

          if [ -n "$HAS_CHANGES" ]; then
            echo "Uncommitted changes remain after the Claude run — committing them as a safety net."
            NOTE="$REASON Whatever partial work was done is committed below."
          else
            echo "Claude exited non-zero and made no changes at all — logging so this isn't silent."
            NOTE="$REASON Nothing was changed or committed tonight."
          fi

          {
            echo ""
            echo "## $TODAY — NEEDS-ATTENTION: run did not finish cleanly"
            echo "$NOTE"
          } >> data/run-log.md
          git add -A
          git commit -m "nightly: $TODAY — run did not finish cleanly (see run-log.md)"
          git push
